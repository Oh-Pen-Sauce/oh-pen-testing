name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the GitHub Release
  id-token: write   # needed for npm provenance (OIDC attestation)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Job-level env IS visible to a step's own `if:`, unlike step-level
      # env, and unlike the `secrets` context (which cannot be referenced
      # in an `if:` at all and fails workflow validation if you try).
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gh CLI can build release notes

      # No `version:` here: package.json's `packageManager` is the single
      # source of truth. Specifying both makes pnpm/action-setup@v4 fail
      # with "Multiple versions of pnpm".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm test

      - name: Publish CLI to npm
        # Only runs if NPM_TOKEN is set; skipped silently otherwise so
        # contributors can tag without publishing. Gate on the job-level
        # env (set from the secret above).
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter "@oh-pen-testing/*" --no-git-checks publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract the changelog section for this tag (the block under the
          # matching `## [X.Y.Z]` header, up to the next `## [`). Match the
          # header LITERALLY with index(): the version contains `.` and the
          # heading has `[ ]`, both of which are regex metacharacters, so a
          # `$0 ~ t` regex match would treat `[1.0.3]` as a character class.
          TAG="${GITHUB_REF#refs/tags/v}"
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md > release-notes.md
          gh release create "v$TAG" \
            --title "v$TAG" \
            --notes-file release-notes.md \
            --verify-tag
